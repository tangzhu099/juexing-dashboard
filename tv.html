<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>觉醒团队 · TV运营看板</title>
<style>
:root {
  --bg:#f4f7ef; --card:#ffffff; --border:#e6ebdd;
  --text:#1a2e1d; --muted:#5c6b58; --dim:#8a9984;
  --danger:#dc2626; --warn:#d97706; --ok:#2d7a46; --info:#2563eb; --accent:#7c3aed;
  --green:#3a6b35; --green-soft:#5a8a4f; --green-light:#e8f0d8; --green-pale:#f0f5e8;
  --shadow:0 2px 14px rgba(58,107,53,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
.header-gradient { background:linear-gradient(135deg,#3a6b35,#5a8a4f); color:#fff; padding:28px 24px 22px; }
.header-gradient h1 { font-size:22px; font-weight:800; display:flex; align-items:center; gap:8px; }
.header-gradient .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.header-gradient .date { font-size:12px; opacity:0.9; }
.summary-card { background:rgba(255,255,255,0.16); border-radius:14px; padding:14px 16px; font-size:13px; line-height:1.6; backdrop-filter:blur(4px); margin-top:12px; }
.summary-card strong { color:#e8f0d8; }
.section-title { font-size:15px; font-weight:800; color:var(--green); display:flex; align-items:center; gap:7px; margin-bottom:14px; }
.section-title::before { content:""; width:4px; height:16px; background:var(--green); border-radius:2px; }
.kpi-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px 14px; text-align:center; box-shadow:var(--shadow); }
.kpi-card .label { font-size:11px; color:var(--muted); margin-bottom:8px; }
.kpi-card .value { font-size:26px; font-weight:800; color:var(--text); }
.kpi-card .sub { font-size:11px; color:var(--dim); margin-top:4px; line-height:1.3; }
.kpi-card .change { font-size:10px; margin-top:8px; font-weight:700; padding:4px 10px; border-radius:10px; display:inline-block; background:var(--green-light); color:var(--green); }
.kpi-card.warn .change { background:#fef3c7; color:var(--warn); }
.kpi-card.danger .change { background:#fde8e8; color:var(--danger); }
.kpi-card.ok .change { background:#e6f4ea; color:var(--ok); }
.fw-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px 14px; text-align:center; box-shadow:var(--shadow); position:relative; overflow:hidden; }
.fw-card::after { content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--green-soft); }
.fw-card.priority::after { background:var(--danger); }
.fw-card.warn::after { background:var(--warn); }
.fw-card.info::after { background:var(--info); }
.fw-icon { width:48px; height:48px; border-radius:50%; background:var(--green-pale); display:flex; align-items:center; justify-content:center; font-size:22px; margin:0 auto 10px; }
.fw-card.priority .fw-icon { background:#fde8e8; }
.fw-name { font-size:14px; font-weight:700; }
.fw-data { font-size:18px; font-weight:800; color:var(--green); margin:4px 0 2px; }
.fw-label { font-size:11px; color:var(--muted); }
.fw-detail { font-size:10px; color:var(--dim); margin-top:7px; line-height:1.4; }
.prod-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; box-shadow:var(--shadow); }
.prod-title { font-size:15px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.prod-metric { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.prod-metric:last-of-type { border-bottom:none; }
.prod-metric .name { color:var(--muted); }
.prod-metric .val { font-weight:700; }
.prod-progress { height:7px; background:var(--green-light); border-radius:4px; margin-top:10px; overflow:hidden; }
.prod-progress > div { height:100%; background:var(--green); border-radius:4px; }
.tl-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px 17px; box-shadow:var(--shadow); }
.tl-card.priority { border-color:var(--danger); border-width:2px; }
.tl-card.done { opacity:0.6; }
.tl-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.tl-name { font-size:15px; font-weight:700; }
.tl-tag { font-size:10px; font-weight:700; padding:3px 9px; border-radius:10px; background:var(--green-light); color:var(--green); }
.tl-tag.warn { background:#fef3c7; color:var(--warn); }
.tl-tag.ok { background:#e6f4ea; color:var(--ok); }
.tl-tag.info { background:#e8eef9; color:var(--info); }
.tl-tag.danger { background:#fde8e8; color:var(--danger); }
.tl-body { font-size:12px; color:var(--muted); line-height:1.5; }
.tl-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:9px; font-size:11px; color:var(--dim); }
.team-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 17px; box-shadow:var(--shadow); }
.team-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.team-name { font-size:15px; font-weight:800; }
.team-load { font-size:11px; font-weight:700; padding:3px 11px; border-radius:10px; }
.team-load.ok { background:#e6f4ea; color:var(--ok); }
.team-load.warn { background:var(--green-light); color:var(--green); }
.team-load.danger { background:#fde8e8; color:var(--danger); }
.team-roles { display:flex; gap:5px; flex-wrap:wrap; }
.team-role { font-size:10px; padding:3px 9px; border-radius:8px; background:var(--green-pale); color:var(--green); }
.act-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 17px; box-shadow:var(--shadow); display:flex; align-items:flex-start; gap:11px; }
.act-prio { width:23px; height:23px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; color:#fff; }
.act-prio.p0 { background:var(--danger); }
.act-prio.p1 { background:var(--warn); }
.act-prio.p2 { background:var(--info); }
.act-text { font-size:13px; flex:1; line-height:1.45; }
.act-owner { font-size:10px; color:var(--dim); white-space:nowrap; margin-left:6px; }

body { padding-bottom: 74px; }
.header-gradient { padding: 24px 20px 20px; }
.header-gradient h1 { font-size: 20px; }
.section { padding: 18px 16px 4px; }
.kpi-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; -webkit-overflow-scrolling: touch; }
.kpi-scroll::-webkit-scrollbar { display: none; }
.kpi-card { flex: 0 0 31%; min-width: 110px; }
.fw-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px; }
.prod-card, .tl-card, .team-card, .act-card { margin: 0 16px 12px; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; padding: 8px 0; box-shadow: 0 -2px 12px rgba(0,0,0,0.04); }
.nav-item { flex: 1; text-align: center; font-size: 10px; color: var(--dim); text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.nav-item.active { color: var(--green); }
.nav-item .nicon { font-size: 18px; }
.footer { text-align: center; color: var(--dim); font-size: 11px; padding: 16px 0 8px; }
.revenue-card { background: linear-gradient(135deg,#3a6b35,#5a8a4f); border-radius: 14px; padding: 16px 18px; margin: 8px 16px 4px; color: #fff; box-shadow: 0 3px 14px rgba(58,107,53,0.18); }
.revenue-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
.revenue-label { font-size: 12px; opacity: 0.9; }
.revenue-main { font-size: 28px; font-weight: 800; line-height: 1; margin-top: 2px; }
.revenue-main small { font-size: 13px; font-weight: 600; opacity: 0.85; }
.revenue-target { font-size: 12px; opacity: 0.9; text-align: right; }
.revenue-target b { font-size: 16px; }
.revenue-bar { height: 9px; background: rgba(255,255,255,0.25); border-radius: 5px; overflow: hidden; margin: 10px 0; }
.revenue-bar > div { height: 100%; background: #fff; border-radius: 5px; }
.revenue-split { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rev-item { background: rgba(255,255,255,0.15); border-radius: 8px; padding: 7px 8px; }
.rev-item .n { font-size: 9px; opacity: 0.85; }
.rev-item .v { font-size: 14px; font-weight: 700; margin-top: 1px; }
.revenue-gap { font-size: 11px; opacity: 0.9; margin-top: 8px; }


/* ===== TV 大屏横屏覆盖样式（仅在大屏横屏时生效）===== */
@media (min-aspect-ratio: 16/10) and (min-width: 1024px), (min-aspect-ratio: 4/3) and (min-width: 1200px) {
  html, body { height: 100%; overflow: hidden; padding-bottom: 0; }
  .header-gradient { padding: 2vh 2.5vw 1.8vh; border-radius: 0; }
  .header-gradient h1 { font-size: 2.8vh; }
  .header-gradient .date { font-size: 1.4vh; }
  .summary-card { padding: 1.2vh 2vh; font-size: 1.4vh; margin-top: 1vh; max-height: 7vh; overflow: hidden; }

  .section { padding: 0; }
  .section-title { font-size: 1.5vh; margin-bottom: 1vh; }

  .nav, .footer { display: none; }

  .revenue-card { margin: 1vh 2.2vw 0; padding: 1.2vh 2vw; border-radius: 1vh; }
  .revenue-label { font-size: 1.2vh; }
  .revenue-main { font-size: 2.6vh; }
  .revenue-target { font-size: 1.2vh; }
  .revenue-target b { font-size: 1.8vh; }
  .revenue-bar { height: 0.8vh; margin: 0.8vh 0; }
  .rev-item { padding: 0.5vh 0.8vh; border-radius: 0.6vh; }
  .rev-item .n { font-size: 0.8vh; }
  .rev-item .v { font-size: 1.3vh; }
  .revenue-gap { font-size: 1vh; margin-top: 0.5vh; }

  .tv-layout { display: grid; grid-template-columns: 0.9fr 1.5fr 1.1fr; gap: 1.4vw; padding: 0 2.2vw; height: calc(100% - 24vh); }
  .tv-layout > .tv-col { display: flex; flex-direction: column; gap: 1.4vh; min-height: 0; overflow: hidden; }
  .tv-col > div { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

  .kpi-scroll { overflow-x: visible; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0.8vh; padding: 0; flex: 1; min-height: 0; }
  .kpi-card { flex: none; min-width: auto; padding: 1vh 0.7vh; border-radius: 1vh; }
  .kpi-card .label { font-size: 1vh; margin-bottom: 0.3vh; }
  .kpi-card .value { font-size: 1.8vh; }
  .kpi-card .sub { font-size: 0.8vh; }
  .kpi-card .change { font-size: 0.75vh; padding: 0.2vh 0.5vh; margin-top: 0.3vh; }

  .fw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8vh; padding: 0; flex: 1; min-height: 0; overflow-y: auto; }
  .fw-card { padding: 1vh 0.6vh; border-radius: 1vh; }
  .fw-icon { width: 3.2vh; height: 3.2vh; font-size: 1.6vh; margin-bottom: 0.4vh; }
  .fw-name { font-size: 1.1vh; }
  .fw-data { font-size: 1.4vh; }
  .fw-label { font-size: 0.85vh; }
  .fw-detail { font-size: 0.75vh; margin-top: 0.3vh; }

  .product-list, .timeline-list, .team-list, .action-list { overflow-y: auto; flex: 1; min-height: 0; }
  .prod-card, .tl-card, .team-card, .act-card { margin: 0 0 0.6vh 0; padding: 0.9vh 1.1vh; border-radius: 0.9vh; }
  .prod-title { font-size: 1.1vh; margin-bottom: 0.4vh; }
  .prod-metric { font-size: 0.95vh; padding: 0.25vh 0; }
  .prod-progress { height: 0.4vh; margin-top: 0.3vh; }
  .tl-name { font-size: 1.1vh; }
  .tl-tag { font-size: 0.75vh; padding: 0.15vh 0.6vh; }
  .tl-body { font-size: 0.85vh; }
  .tl-bottom { font-size: 0.8vh; margin-top: 0.3vh; }
  .team-name { font-size: 1.1vh; }
  .team-load { font-size: 0.85vh; padding: 0.15vh 0.7vh; }
  .team-role { font-size: 0.75vh; padding: 0.15vh 0.6vh; }
  .act-prio { width: 1.5vh; height: 1.5vh; font-size: 0.75vh; }
  .act-text { font-size: 0.95vh; }
  .act-owner { font-size: 0.75vh; }

  .tv-clock { display: block; position: fixed; top: 1.2vh; right: 2.2vw; font-size: 1.3vh; color: var(--dim); background: rgba(255,255,255,0.7); padding: 0.2vh 0.8vh; border-radius: 0.8vh; }
  .rotate-tip { display: none; }
}

.tv-clock { display: none; }
</style>
</head>

<div class="tv-clock" id="clock">--:--</div>

<div class="header-gradient">
  <div class="top">
    <h1>⚡ 觉醒团队 · TV运营看板</h1>
    <div class="date" id="meta-date">--</div>
  </div>
  <div class="summary-card" id="summary"></div>
</div>

<div class="revenue-card" id="revenue-card"></div>

<!-- 竖屏：直接显示 H5 结构（TV 覆盖样式会把它变成三栏） -->
<div class="tv-layout" id="tv-layout">
  <div class="tv-col tv-col-left">
    <div class="tv-panel" style="flex: 0 0 auto; max-height: 42%;">
      <div class="section-title">📊 核心指标</div>
      <div class="kpi-scroll" id="kpi-scroll"></div>
    </div>
    <div class="tv-panel" style="flex: 1; min-height: 0;">
      <div class="section-title">👥 团队精力</div>
      <div class="team-list" id="team-list"></div>
    </div>
  </div>
  <div class="tv-col tv-col-center">
    <div class="tv-panel" style="flex: 0 0 auto; max-height: 45%;">
      <div class="section-title">🎯 本月重点项目</div>
      <div class="fw-grid" id="fw-grid"></div>
    </div>
    <div class="tv-panel" style="flex: 1; min-height: 0;">
      <div class="section-title">📅 活动看板</div>
      <div class="timeline-list" id="timeline-list"></div>
    </div>
  </div>
  <div class="tv-col tv-col-right">
    <div class="tv-panel" style="flex: 0 0 auto; max-height: 55%;">
      <div class="section-title">📦 产品进度</div>
      <div class="product-list" id="product-list"></div>
    </div>
    <div class="tv-panel" style="flex: 1; min-height: 0;">
      <div class="section-title">⚡ 行动清单</div>
      <div class="action-list" id="action-list"></div>
    </div>
  </div>
</div>

<div class="footer">觉醒团队 · 运营仪表盘 | 更新于 <span id="footer-date">--</span></div>

<div class="nav">
  <a class="nav-item active" href="#"><span class="nicon">📊</span>概览</a>
  <a class="nav-item" href="#"><span class="nicon">🎯</span>项目</a>
  <a class="nav-item" href="#"><span class="nicon">👥</span>团队</a>
  <a class="nav-item" href="#"><span class="nicon">⚡</span>行动</a>
</div>

function b64DecodeUtf8(str){return decodeURIComponent(escape(atob(str)));}
var d = JSON.parse(b64DecodeUtf8(B64));
var COLORS = {danger:"#dc2626", warn:"#d97706", ok:"#2d7a46", info:"#2563eb", accent:"#7c3aed"};

function renderKPI(containerId, limit){
  var el = document.getElementById(containerId);
  (limit ? d.kpi.slice(0,limit) : d.kpi).forEach(function(k){
    var div = document.createElement("div"); div.className = "kpi-card " + (k.color||"info");
    div.innerHTML = "<div class=\"label\">" + k.label + "</div><div class=\"value\">" + k.value + "</div><div class=\"sub\">" + k.sub + "</div><div class=\"change\">" + (k.change||"") + "</div>";
    el.appendChild(div);
  });
}

function renderFlywheel(containerId){
  var el = document.getElementById(containerId);
  d.flywheel.forEach(function(f){
    var div = document.createElement("div"); div.className = "fw-card " + (f.status||"info");
    div.innerHTML = "<div class=\"fw-icon\">" + f.icon + "</div><div class=\"fw-name\">" + f.name + "</div><div class=\"fw-data\">" + f.data + "</div><div class=\"fw-label\">" + f.label + "</div><div class=\"fw-detail\">" + (f.detail||"").replace(/\n/g,"<br>") + "</div>";
    el.appendChild(div);
  });
}

function renderProducts(containerId){
  var el = document.getElementById(containerId);
  d.products.forEach(function(p){
    var card = document.createElement("div"); card.className = "prod-card";
    var html = "<div class=\"prod-title\">" + p.icon + " " + p.name + "</div>";
    var target=0, done=0;
    p.metrics.forEach(function(m){
      if(m.name.indexOf("目标")>-1){var n=parseInt(m.value.replace(/[^0-9]/g,"")); if(n) target=n;}
      if(m.name.indexOf("已完成")>-1 && typeof m.change==="number" && m.change>0) done = m.change;
    });
    var pct = target && done ? Math.min(100, Math.round(done/target*100)) : 0;
    p.metrics.forEach(function(m){
      html += "<div class=\"prod-metric\"><span class=\"name\">" + m.name + "</span><span class=\"val\" style=\"color:" + (COLORS[m.status]||"#1a2e1d") + "\">" + m.value + "</span></div>";
    });
    if(pct) html += "<div class=\"prod-progress\"><div style=\"width:" + pct + "%\"></div></div>";
    card.innerHTML = html;
    el.appendChild(card);
  });
}

function renderTimeline(containerId){
  var el = document.getElementById(containerId);
  d.timeline.forEach(function(t){
    var div = document.createElement("div"); div.className = "tl-card" + (t.status==="priority"?" priority":"") + (t.status==="done"?" done":"");
    var tc = t.status==="priority"?"danger":(t.status==="done"?"ok":(t.status==="warn"?"warn":"info"));
    div.innerHTML = "<div class=\"tl-top\"><span class=\"tl-name\">" + t.name + "</span><span class=\"tl-tag " + tc + "\">" + t.tag + "</span></div><div class=\"tl-body\">" + (t.desc||"") + "</div><div class=\"tl-bottom\"><span>" + t.date + "</span><span>" + t.owner + "</span></div>";
    el.appendChild(div);
  });
}

function renderTeam(containerId){
  var el = document.getElementById(containerId);
  d.team.forEach(function(t){
    var card = document.createElement("div"); card.className = "team-card";
    var roles = t.roles.map(function(r){return "<span class=\"team-role\">" + r + "</span>";}).join("");
    card.innerHTML = "<div class=\"team-head\"><span class=\"team-name\">" + t.name + "</span><span class=\"team-load " + (t.loadColor||"ok") + "\">" + t.load + "</span></div><div class=\"team-roles\">" + roles + "</div>";
    el.appendChild(card);
  });
}

function renderActions(containerId){
  var el = document.getElementById(containerId);
  d.actions.forEach(function(a){
    var div = document.createElement("div"); div.className = "act-card";
    div.innerHTML = "<span class=\"act-prio " + a.priority + "\">" + a.priority.replace("p","") + "</span><span class=\"act-text\">" + a.text + "</span><span class=\"act-owner\">" + a.owner + "</span>";
    el.appendChild(div);
  });
}

document.getElementById("meta-date").textContent = "更新：" + d.updated;
document.getElementById("footer-date").textContent = d.updated;
document.getElementById("summary").innerHTML = "<strong>核心诊断：</strong>" + d.summary;
if (d.revenue) {
  var r = d.revenue;
  var split = (r.breakdown || []).map(function(b) {
    return '<div class="rev-item"><div class="n">' + b.name + '</div><div class="v">' + b.value + '</div></div>';
  }).join('');
  document.getElementById('revenue-card').innerHTML =
    '<div class="revenue-top"><div><div class="revenue-label">💰 本月总营收</div><div class="revenue-main">' + r.current + ' <small>/ ' + r.target + '</small></div></div><div class="revenue-target">完成度<br><b>' + r.percent + '%</b></div></div>' +
    '<div class="revenue-bar"><div style="width:' + r.percent + '%"></div></div>' +
    '<div class="revenue-split">' + split + '</div>' +
    '<div class="revenue-gap">📌 剩余缺口：' + (r.gap || '—') + '（目标 ' + r.target + '）</div>';
}
renderKPI("kpi-scroll");
renderFlywheel("fw-grid");
renderProducts("product-list");
renderTimeline("timeline-list");
renderTeam("team-list");
renderActions("action-list");
function updateClock(){ var now = new Date(); document.getElementById("clock").textContent = now.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}); }
updateClock(); setInterval(updateClock, 60000);
</script>
</body>
</html>
