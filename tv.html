<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>觉醒团队 · TV运营看板</title>
<style>
:root {
  --bg:#0b1324; --panel:#111d32; --border:#1e2d47;
  --text:#f1f5f9; --muted:#94a3b8; --dim:#64748b;
  --danger:#ef4444; --warn:#f59e0b; --ok:#22c55e; --info:#3b82f6; --accent:#8b5cf6;
  --danger-bg:#3b1010; --warn-bg:#3d2800; --ok-bg:#0a3018; --info-bg:#0c1f3d; --accent-bg:#1e1040;
  --green:#059669; --green-bg:#064e3b; --lime:#84cc16; --lime-bg:#365314;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
.tv{width:100vw;height:100vh;padding:2vh 2.5vw;display:grid;grid-template-rows:auto 1fr auto;gap:1.5vh;}
.tv-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--border);padding-bottom:1.2vh;}
.tv-header h1{font-size:3.2vh;font-weight:800;letter-spacing:1px;}
.tv-header h1 span{color:var(--lime);}
.tv-header .meta{text-align:right;}
.tv-header .date{font-size:1.8vh;color:var(--muted);}
.tv-header .badge{display:inline-block;margin-top:0.4vh;padding:0.4vh 1.2vh;border-radius:1vh;font-size:1.3vh;font-weight:700;background:var(--green-bg);color:#6ee7b7;}
.tv-summary{font-size:1.65vh;line-height:1.6;color:var(--muted);max-width:55vw;}
.tv-summary strong{color:var(--warn);}
.tv-body{display:grid;grid-template-columns:1.1fr 1.4fr 1.1fr;gap:1.5vw;min-height:0;}
.tv-panel{background:var(--panel);border:1px solid var(--border);border-radius:1.2vh;padding:1.5vh;display:flex;flex-direction:column;min-height:0;}
.tv-panel-title{font-size:1.5vh;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:1.2vh;flex-shrink:0;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:1vh;overflow:auto;}
.kpi-card{background:rgba(30,41,59,0.5);border-radius:1vh;padding:1.4vh 1vh;text-align:center;border-left:0.35vh solid var(--info);display:flex;flex-direction:column;justify-content:center;}
.kpi-card.warn{border-color:var(--warn);background:var(--warn-bg);}
.kpi-card.ok{border-color:var(--ok);background:var(--ok-bg);}
.kpi-card.info{border-color:var(--info);background:var(--info-bg);}
.kpi-card.danger{border-color:var(--danger);background:var(--danger-bg);}
.kpi-card .label{font-size:1.3vh;color:var(--muted);margin-bottom:0.6vh;}
.kpi-card .value{font-size:2.6vh;font-weight:800;margin-bottom:0.4vh;}
.kpi-card .sub{font-size:1.15vh;color:var(--dim);line-height:1.3;}
.kpi-card .change{font-size:1.1vh;margin-top:0.5vh;font-weight:600;}
.fw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1vh;overflow:auto;}
.fw-item{background:rgba(30,41,59,0.5);border-radius:1vh;padding:1.4vh 1vh;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px solid var(--border);}
.fw-item.priority{border-color:var(--danger);background:var(--danger-bg);}
.fw-item.warn{border-color:var(--warn);background:var(--warn-bg);}
.fw-item.info{border-color:var(--info);background:var(--info-bg);}
.fw-icon{width:4.5vh;height:4.5vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.2vh;margin-bottom:0.8vh;background:var(--green-bg);}
.fw-item.priority .fw-icon{background:var(--danger-bg);}
.fw-item.warn .fw-icon{background:var(--warn-bg);}
.fw-item.info .fw-icon{background:var(--info-bg);}
.fw-name{font-size:1.45vh;font-weight:700;margin-bottom:0.3vh;}
.fw-data{font-size:1.8vh;font-weight:800;color:var(--lime);margin-bottom:0.3vh;}
.fw-label{font-size:1.1vh;color:var(--muted);}
.fw-detail{font-size:1vh;color:var(--dim);margin-top:0.4vh;line-height:1.3;}
.product-list{overflow:auto;display:flex;flex-direction:column;gap:0.9vh;}
.prod-card{background:rgba(30,41,59,0.5);border-radius:1vh;padding:1.1vh 1.2vh;border:1px solid var(--border);}
.prod-title{font-size:1.25vh;font-weight:700;color:var(--muted);margin-bottom:0.6vh;display:flex;align-items:center;gap:0.5vh;}
.prod-metric{display:flex;justify-content:space-between;align-items:center;font-size:1.15vh;padding:0.3vh 0;}
.prod-metric .val{font-weight:700;}
.prod-progress{height:0.5vh;background:var(--border);border-radius:0.25vh;margin-top:0.5vh;overflow:hidden;}
.prod-progress>div{height:100%;background:var(--green);border-radius:0.25vh;}
.tv-footer{display:grid;grid-template-columns:1fr 1.5fr;gap:1.5vw;min-height:16vh;}
.team-list{display:flex;flex-direction:column;gap:0.5vh;overflow:auto;}
.team-row{display:flex;align-items:center;gap:0.8vh;padding:0.5vh 0;border-bottom:1px solid var(--border);font-size:1.15vh;}
.team-row:last-child{border-bottom:none;}
.team-name{width:6vh;font-weight:700;}
.team-roles{flex:1;display:flex;gap:0.4vh;flex-wrap:wrap;}
.team-role{font-size:0.95vh;padding:0.15vh 0.6vh;border-radius:0.4vh;background:var(--border);color:var(--muted);}
.team-load{font-weight:700;}
.action-list{display:flex;flex-direction:column;gap:0.5vh;overflow:auto;}
.action-row{display:flex;align-items:flex-start;gap:0.8vh;padding:0.5vh 0;border-bottom:1px solid var(--border);font-size:1.15vh;line-height:1.35;}
.action-row:last-child{border-bottom:none;}
.action-prio{width:1.8vh;height:1.8vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.9vh;font-weight:800;flex-shrink:0;margin-top:0.1vh;}
.action-prio.p0{background:var(--danger);color:#fff;}
.action-prio.p1{background:var(--warn);color:#000;}
.action-prio.p2{background:var(--info);color:#fff;}
.action-owner{margin-left:auto;white-space:nowrap;color:var(--dim);font-size:1vh;}
.tv-clock{position:fixed;top:1.5vh;right:2.5vw;font-size:1.4vh;color:var(--dim);}
</style>
</head>
<body>
<div class="tv">
  <div class="tv-clock" id="clock">--:--</div>
  <div class="tv-header">
    <div>
      <h1><span>⚡</span> 觉醒团队 · TV运营看板</h1>
      <div class="tv-summary" id="summary"></div>
    </div>
    <div class="meta">
      <div class="date" id="meta-date">--</div>
      <div class="badge">数据驱动 · 实时刷新</div>
    </div>
  </div>
  <div class="tv-body">
    <div class="tv-panel">
      <div class="tv-panel-title">📊 核心指标</div>
      <div class="kpi-grid" id="kpi-grid"></div>
    </div>
    <div class="tv-panel">
      <div class="tv-panel-title">🎯 本月重点项目</div>
      <div class="fw-grid" id="fw-grid"></div>
    </div>
    <div class="tv-panel">
      <div class="tv-panel-title">📦 产品进度</div>
      <div class="product-list" id="product-list"></div>
    </div>
  </div>
  <div class="tv-footer">
    <div class="tv-panel">
      <div class="tv-panel-title">👥 团队精力</div>
      <div class="team-list" id="team-list"></div>
    </div>
    <div class="tv-panel">
      <div class="tv-panel-title">⚡ 行动清单</div>
      <div class="action-list" id="action-list"></div>
    </div>
  </div>
</div>

function b64DecodeUtf8(str){return decodeURIComponent(escape(atob(str)));}
var d = JSON.parse(b64DecodeUtf8(B64));
var COLORS = {danger:'#ef4444', warn:'#f59e0b', ok:'#22c55e', info:'#3b82f6', accent:'#8b5cf6'};
document.getElementById('meta-date').textContent = '更新：' + d.updated + (d.week ? ' | ' + d.week : '');
document.getElementById('summary').innerHTML = '<strong>核心诊断：</strong>' + d.summary;

// KPI
var kpiEl = document.getElementById('kpi-grid');
d.kpi.forEach(function(k){
  var div = document.createElement('div'); div.className = 'kpi-card ' + (k.color||'info');
  div.innerHTML = '<div class="label">' + k.label + '</div><div class="value">' + k.value + '</div><div class="sub">' + k.sub + '</div><div class="change" style="color:' + (COLORS[k.color]||'#94a3b8') + '">' + (k.change||'') + '</div>';
  kpiEl.appendChild(div);
});

// Flywheel
var fwEl = document.getElementById('fw-grid');
d.flywheel.forEach(function(f){
  var div = document.createElement('div'); div.className = 'fw-item ' + (f.status||'info');
  div.innerHTML = '<div class="fw-icon">' + f.icon + '</div><div class="fw-name">' + f.name + '</div><div class="fw-data">' + f.data + '</div><div class="fw-label">' + f.label + '</div><div class="fw-detail">' + (f.detail||'').replace(/\n/g,'<br>') + '</div>';
  fwEl.appendChild(div);
});

// Products with progress bar for GMV
var prodEl = document.getElementById('product-list');
d.products.forEach(function(p){
  var card = document.createElement('div'); card.className = 'prod-card';
  var html = '<div class="prod-title">' + p.icon + ' ' + p.name + '</div>';
  // 找目标和已完成做进度条
  var target=0, done=0;
  p.metrics.forEach(function(m){
    if(m.name.indexOf('目标')>-1 && m.value.replace(/[^0-9]/g,'')) target = parseInt(m.value.replace(/[^0-9]/g,''));
    if((m.name.indexOf('已完成')>-1 || m.name.indexOf('已完成')>-1) && typeof m.change==='number' && m.change>0) done = m.change;
  });
  var pct = target && done ? Math.min(100, Math.round(done/target*100)) : 0;
  p.metrics.slice(0,3).forEach(function(m){
    html += '<div class="prod-metric"><span>' + m.name + '</span><span class="val" style="color:' + (COLORS[m.status]||'#f1f5f9') + '">' + m.value + '</span></div>';
  });
  if(pct) html += '<div class="prod-progress"><div style="width:' + pct + '%"></div></div>';
  card.innerHTML = html;
  prodEl.appendChild(card);
});

// Team
var teamEl = document.getElementById('team-list');
d.team.forEach(function(t){
  var row = document.createElement('div'); row.className = 'team-row';
  var roles = t.roles.map(function(r){return '<span class="team-role">' + r + '</span>';}).join('');
  row.innerHTML = '<span class="team-name">' + t.name + '</span><div class="team-roles">' + roles + '</div><span class="team-load" style="color:' + (COLORS[t.loadColor]||'#94a3b8') + '">' + t.load + '</span>';
  teamEl.appendChild(row);
});

// Actions
var actEl = document.getElementById('action-list');
d.actions.slice(0,8).forEach(function(a){
  var row = document.createElement('div'); row.className = 'action-row';
  row.innerHTML = '<span class="action-prio ' + a.priority + '">' + a.priority.replace('p','') + '</span><span>' + a.text + '</span><span class="action-owner">' + a.owner + '</span>';
  actEl.appendChild(row);
});

// Clock
function updateClock(){
  var now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
updateClock(); setInterval(updateClock, 60000);
</script>
